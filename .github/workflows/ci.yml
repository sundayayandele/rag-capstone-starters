name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      llm:
        description: "LLM provider for the evaluation (none, github, anthropic)"
        default: "none"
      run_ml:
        description: "Also run the neural embedder and cross-encoder evaluation (evaluate-ml job, slower)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      models: read          # lets GITHUB_TOKEN call GitHub Models when llm=github
    env:
      RAG_LLM: ${{ github.event.inputs.llm || 'none' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and project tests
        run: pytest -q
      - name: Run evaluation and regression gate
        run: python -m ragkit eval --out results --site site
      - name: Publish results table to the job summary
        if: always()
        run: |
          if [ -f results/RESULTS.md ]; then cat results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-results
          path: |
            results/
            site/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: evaluate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Manual only: tick "run_ml" when you start the workflow. Informational, it does not block merges.
  evaluate-ml:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      models: read
    env:
      RAG_EMBEDDER: st
      RAG_RERANKER: ce
      RAG_LLM: ${{ github.event.inputs.llm || 'none' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ runner.os }}-bge-small-bge-reranker-base-v1
      - name: Install CPU-only torch, then the ml extras
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,ml]"
      - name: Evaluate with neural embedder and cross-encoder
        id: ml_eval
        continue-on-error: true   # thresholds were tuned for the offline defaults; read the table, do not block
        run: python -m ragkit eval --out results-ml --site site-ml
      - name: Publish neural results to the job summary
        if: always()
        run: |
          echo "## Neural models (RAG_EMBEDDER=st, RAG_RERANKER=ce, RAG_LLM=$RAG_LLM)" >> "$GITHUB_STEP_SUMMARY"
          echo "Evaluation step outcome: ${{ steps.ml_eval.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results-ml/RESULTS.md ]; then cat results-ml/RESULTS.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload neural results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-results-ml
          path: |
            results-ml/
            site-ml/
